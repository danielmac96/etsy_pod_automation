name: Weekly Copy Generation & Printify Drafts
on:
  schedule:
    - cron: '0 14 * * 4'  # Thursday 9am EST
  workflow_dispatch:

jobs:
  copy-and-draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Generate AI product copy for image-approved designs
        run: python scripts/04_generate_copy.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Create Printify drafts
        run: python scripts/06_printify_upload.py
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}

      # Fully hands-off mode: when the AUTO_PUBLISH repo variable is 1, fresh
      # drafts are published to Etsy immediately (the notify step then sends
      # the "published" confirmation instead of an approval request). With the
      # gate closed this step is skipped and Friday's workflow publishes
      # whatever was approved in the app's Publish tab.
      - name: Auto-publish drafts to Etsy (only when AUTO_PUBLISH=1)
        if: ${{ vars.AUTO_PUBLISH == '1' }}
        run: python scripts/08_publish_etsy.py
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          AUTO_PUBLISH: '1'

      - name: Send draft-ready email
        run: python scripts/05_notify.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCAL_APP_URL: ${{ vars.LOCAL_APP_URL || 'http://localhost:8501' }}

      - name: Commit pod.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pod.db
          git diff --cached --quiet || git commit -m "auto: weekly copy + Printify drafts [skip ci]"
          git push
