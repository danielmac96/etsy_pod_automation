name: Weekly Research & Prompt Generation
on:
  schedule:
    - cron: '0 14 * * 1'  # Monday 9am EST
  workflow_dispatch:

jobs:
  research-and-prompts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Research themes → concepts → briefs
        run: python scripts/01_research.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}

      - name: Generate 25 prompts and save to pod.db
        run: python scripts/02_generate_prompts.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Send prompt review email
        run: python scripts/05_notify.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCAL_APP_URL: ${{ vars.LOCAL_APP_URL || 'http://localhost:8501' }}

      - name: Commit pod.db + design_briefs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pod.db design_briefs.json prompts.json runs/ || true
          git diff --cached --quiet || git commit -m "auto: weekly research + prompts [skip ci]"
          git push
