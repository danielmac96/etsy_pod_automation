name: Weekly Image Generation
on:
  schedule:
    - cron: '0 14 * * 3'  # Wednesday 9am EST
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Generate images for Prompt Approved designs
        run: python scripts/03_generate_images.py
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}

      - name: Send image review notification
        run: python scripts/05_notify.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
