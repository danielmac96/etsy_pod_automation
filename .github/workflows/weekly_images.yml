name: Weekly Image Generation
on:
  schedule:
    - cron: '0 14 * * 3'  # Wednesday 9am EST
  workflow_dispatch:

jobs:
  generate-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Generate images for prompt-approved designs
        run: python scripts/03_generate_images.py
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_APPROVE_IMAGES: ${{ vars.AUTO_APPROVE_IMAGES || '0' }}
          AUTO_APPROVE_IMAGE_MIN_SCORE: ${{ vars.AUTO_APPROVE_IMAGE_MIN_SCORE || '8' }}
          AUTO_REJECT_IMAGE_MAX_SCORE: ${{ vars.AUTO_REJECT_IMAGE_MAX_SCORE || '3' }}

      - name: Send image review email
        run: python scripts/05_notify.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          LOCAL_APP_URL: ${{ vars.LOCAL_APP_URL || 'http://localhost:8501' }}

      - name: Commit pod.db + image artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pod.db images/ || true
          git diff --cached --quiet || git commit -m "auto: weekly images [skip ci]"
          git push
