name: Weekly Stats Sync
on:
  schedule:
    - cron: '0 14 * * 0'  # Sunday 9am EST
  workflow_dispatch:

jobs:
  sync-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Auto-detect Etsy URLs + sync listing stats
        run: python scripts/07_track_stats.py
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_ACCESS_TOKEN: ${{ secrets.ETSY_ACCESS_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}

      - name: Commit pod.db
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pod.db
          git diff --cached --quiet || git commit -m "auto: weekly stats sync [skip ci]"
          git push
